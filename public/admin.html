<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Central WhatsApp</title>
  <style>
    :root { --ink:#edf3f1; --muted:#a8bbb5; --bg:#101917; --panel:#172521; --line:#2d413a; --mint:#8de3bd; --amber:#f5c977; --red:#ff9b92; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1280px;margin:auto;padding:36px 24px 64px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1;letter-spacing:-.045em;margin:0}h1 span{color:var(--mint)}p{color:var(--muted);margin:10px 0 0;max-width:62ch}.panel{background:var(--panel);border-radius:15px;padding:24px;box-shadow:0 20px 44px rgba(0,0,0,.19)}.auth{max-width:470px;margin:9vh auto}.auth h1{font-size:2.5rem}.form{display:grid;gap:15px;margin-top:22px}label{display:grid;gap:7px;color:var(--muted);font-size:.9rem}input{width:100%;background:#0e1714;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit}input:focus,button:focus{outline:3px solid rgba(141,227,189,.35);outline-offset:2px}button{border:0;border-radius:9px;background:var(--mint);color:#092017;font:700 .9rem/1 system-ui;padding:12px 15px;cursor:pointer}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:transparent;border:1px solid #86433e;color:var(--red)}button:hover{filter:brightness(1.06)}.notice{min-height:24px;color:var(--amber);margin-top:14px}.auth-actions{display:flex;gap:10px;margin-top:12px}.auth-actions button{flex:1}.workspace{display:grid;grid-template-columns:minmax(160px,20%) minmax(0,1fr);gap:32px;align-items:start}.overview{display:grid;grid-template-columns:1fr;position:sticky;top:24px}.metric{padding:13px 0;border-bottom:1px solid var(--line)}.metric:first-child{padding-top:0}.metric b{display:block;font-size:1.55rem;letter-spacing:-.04em}.metric small{color:var(--muted);font-size:.84rem}.content{min-width:0}.section{margin-top:30px}.content .section:first-child{margin-top:0}.section h2{font-size:1.22rem;letter-spacing:-.02em;margin:0 0 12px}.rows{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.name{font-weight:700}.meta{font-size:.82rem;color:var(--muted);margin-top:3px}.status{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);white-space:nowrap}.status.conectado{color:var(--mint)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.foot{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:28px;color:var(--muted);font-size:.88rem}@media(max-width:760px){.shell{padding:28px 18px}.workspace{grid-template-columns:1fr;gap:24px}.overview{position:static;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric,.metric:first-child{padding:12px 0}.section{margin-top:28px}.row{grid-template-columns:1fr auto}.actions{grid-column:1/-1;justify-content:flex-start}.foot{align-items:flex-start;flex-direction:column}header{flex-direction:column}}@media(max-width:500px){.overview{grid-template-columns:1fr}.metric b{font-size:1.4rem}.auth-actions{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"></main>
  <script>
    const app=document.querySelector('#app'); let tokenRecente=null;
    const api=(url, options={})=>fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Não foi possível concluir a ação.');return d});
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function auth(configurado){app.innerHTML=`<section class="panel auth"><h1>${configurado?'Entrar na':'Ativar a'} <span>Central</span></h1><p>${configurado?'Use a conta administrativa criada no primeiro acesso.':'Crie a única conta administrativa do painel. Depois desta etapa, a rota de ativação será desabilitada.'}</p><form class="form" id="form"><label>Usuário<input name="usuario" autocomplete="username" required minlength="3"></label><label>Senha<input name="senha" type="password" autocomplete="${configurado?'current-password':'new-password'}" required minlength="12"></label><button>${configurado?'Entrar':'Criar acesso seguro'}</button></form>${configurado?'<div class="auth-actions"><button class="secondary" type="button" id="forgot">Esqueci minha senha</button></div>':''}<div class="notice" id="notice" role="status"></div></section>`;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api(configurado?'/admin/api/login':'/admin/api/configurar',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});if(configurado)load();else auth(true)}catch(err){document.querySelector('#notice').textContent=err.message}};document.querySelector('#forgot')?.addEventListener('click',recuperarSenha)}
    function recuperarSenha(){app.innerHTML=`<section class="panel auth"><h1>Recuperar <span>acesso</span></h1><p>Enviaremos um link único de redefinição para o e-mail de recuperação cadastrado.</p><form class="form" id="recovery-form"><button>Enviar link de recuperação</button></form><div class="auth-actions"><button class="secondary" type="button" id="back">Voltar ao login</button></div><div class="notice" id="notice" role="status"></div></section>`;document.querySelector('#back').onclick=()=>auth(true);document.querySelector('#recovery-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Enviando…';try{await api('/admin/api/recuperar-senha',{method:'POST',body:'{}'});document.querySelector('#notice').textContent='Link enviado. Verifique sua caixa de entrada.'}catch(err){document.querySelector('#notice').textContent=err.message}finally{b.disabled=false;b.textContent='Enviar link de recuperação'}}}
    function redefinirSenha(token){app.innerHTML=`<section class="panel auth"><h1>Nova <span>senha</span></h1><p>Escolha uma senha de ao menos 12 caracteres. Este link expira em 30 minutos e pode ser usado uma única vez.</p><form class="form" id="reset-form"><label>Nova senha<input name="senha" type="password" autocomplete="new-password" required minlength="12"></label><label>Confirme a nova senha<input name="confirmacao" type="password" autocomplete="new-password" required minlength="12"></label><button>Redefinir senha</button></form><div class="notice" id="notice" role="status"></div></section>`;document.querySelector('#reset-form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.senha!==f.confirmacao){document.querySelector('#notice').textContent='As senhas não coincidem.';return}const b=e.target.querySelector('button');b.disabled=true;b.textContent='Redefinindo…';try{await api('/admin/api/redefinir-senha',{method:'POST',body:JSON.stringify({token,senha:f.senha})});auth(true);document.querySelector('#notice').textContent='Senha redefinida. Entre com sua nova senha.'}catch(err){document.querySelector('#notice').textContent=err.message}finally{b.disabled=false;b.textContent='Redefinir senha'}}}
    const row=x=>`<div class="row"><div><div class="name">${escape(x.nome)}</div><div class="meta">ID técnico: ${escape(x.id)} · ${x.numero?`Conta WhatsApp: ${escape(x.numero)}`:'Conta WhatsApp: não conectada'} · Token configurado</div></div><div class="status ${escape(x.status)}">${escape((x.status||'não iniciado').replace('_',' '))}</div><div class="actions">${tokenRecente?.id===x.id?`<button class="secondary" data-copy="${escape(x.id)}" aria-label="Copiar token de ${escape(x.nome)}">Copiar token</button>`:''}${x.qr?`<button class="secondary" data-qr="${escape(x.id)}">Ver QR</button>`:''}<button class="secondary" data-rotate="${escape(x.id)}">Rotacionar token</button><button class="danger" data-revoke="${escape(x.id)}">Revogar</button><button class="danger" data-kill="${escape(x.id)}">Encerrar processo</button></div></div>`;
    async function load(){try{const d=await api('/admin/api/conexoes');app.innerHTML=`<header><div><h1>Central <span>WhatsApp</span></h1><p>Visão operacional das integrações e das sessões Chromium ativas.</p></div><button class="secondary" id="logout">Sair</button></header><div class="workspace"><aside class="overview" aria-label="Resumo das conexões"><div class="metric"><b>${d.clientes.length}</b><small>integrações</small></div><div class="metric"><b>${d.processos_ativos}</b><small>processos em memória</small></div><div class="metric"><b>${d.memoria_mb} MB</b><small>memória do serviço</small></div></aside><div class="content"><section class="section panel"><h2>Nova integração</h2><form class="form" id="novo"><label>Nome da aplicação<input name="nome" required maxlength="120" placeholder="Ex.: Sistema Like"></label><label>ID técnico<input name="id" required pattern="[a-z0-9][a-z0-9-]{1,62}" placeholder="Ex.: sistema-like"></label><button>Gerar token da integração</button></form>${tokenRecente?`<div class="notice" role="status">Token gerado. Use “Copiar token” ao lado do status da integração antes de atualizar a página.</div>`:''}</section><section class="section"><h2>Integrações</h2><div class="rows">${d.clientes.length?d.clientes.map(row).join(''):'<p>Nenhuma integração cadastrada.</p>'}</div></section><footer class="foot"><span>Encerrar processo preserva a sessão WhatsApp. O próximo acesso a reconecta.</span><button class="danger" id="restart">Reiniciar serviço</button></footer></div></div>`;document.querySelector('#logout').onclick=async()=>{await api('/admin/api/logout',{method:'POST'});boot()};document.querySelector('#novo').onsubmit=async e=>{e.preventDefault();try{const r=await api('/admin/api/clientes',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});tokenRecente={id:r.cliente.id,valor:r.token};load()}catch(err){alert(err.message)}};document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(tokenRecente.valor);const original=b.textContent;b.textContent='Token copiado';setTimeout(()=>{b.textContent=original},1800)}catch{alert('Não foi possível copiar o token. Gere outro token e tente novamente.')}});document.querySelectorAll('[data-kill]').forEach(b=>b.onclick=async()=>{if(!confirm('Encerrar somente o Chromium desta conexão? A sessão será preservada.'))return;try{await api(`/admin/api/clientes/${encodeURIComponent(b.dataset.kill)}/encerrar`,{method:'POST'});load()}catch(e){alert(e.message)}});document.querySelectorAll('[data-rotate]').forEach(b=>b.onclick=async()=>{if(!confirm('Rotacionar o token invalida o token atual imediatamente. Continuar?'))return;const r=await api(`/admin/api/clientes/${encodeURIComponent(b.dataset.rotate)}/rotacionar`,{method:'POST'});tokenRecente={id:b.dataset.rotate,valor:r.token};load()});document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{if(!confirm('Revogar apaga a integração e a sessão WhatsApp. Continuar?'))return;await api(`/admin/api/clientes/${encodeURIComponent(b.dataset.revoke)}`,{method:'DELETE'});if(tokenRecente?.id===b.dataset.revoke)tokenRecente=null;load()});document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>{const x=d.clientes.find(x=>x.id===b.dataset.qr);const w=window.open('','_blank');w.document.write(`<img src="${x.qr}" alt="QR Code">`)});document.querySelector('#restart').onclick=async()=>{if(!confirm('Reiniciar o serviço encerra todos os Chromiums e preserva as sessões. Continuar?'))return;await api('/admin/api/reiniciar',{method:'POST'});app.innerHTML='<section class="panel auth"><h1>Reiniciando</h1><p>O serviço voltará em alguns segundos. Atualize a página.</p></section>'}}catch(e){if(e.message.includes('Faça login'))auth(true);else app.textContent=e.message}}
    async function boot(){const prefix='#redefinir-senha=';if(location.hash.startsWith(prefix)){const token=decodeURIComponent(location.hash.slice(prefix.length));history.replaceState(null,'',location.pathname);return redefinirSenha(token)}const e=await api('/admin/api/estado');if(e.autenticado)load();else auth(e.configurado)}boot();
  </script>
</body>
</html>

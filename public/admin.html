<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Central WhatsApp</title>
  <style>
    :root { --ink:#edf3f1; --muted:#a8bbb5; --bg:#101917; --panel:#172521; --line:#2d413a; --mint:#8de3bd; --amber:#f5c977; --red:#ff9b92; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1080px;margin:auto;padding:44px 24px 72px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:28px}h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1;letter-spacing:-.045em;margin:0}h1 span{color:var(--mint)}p{color:var(--muted);margin:10px 0 0;max-width:62ch}.panel{background:var(--panel);border-radius:15px;padding:28px;box-shadow:0 20px 44px rgba(0,0,0,.19)}.auth{max-width:470px;margin:9vh auto}.auth h1{font-size:2.5rem}.form{display:grid;gap:15px;margin-top:26px}label{display:grid;gap:7px;color:var(--muted);font-size:.9rem}input{width:100%;background:#0e1714;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit}input:focus,button:focus{outline:3px solid rgba(141,227,189,.35);outline-offset:2px}button{border:0;border-radius:9px;background:var(--mint);color:#092017;font:700 .9rem/1 system-ui;padding:12px 15px;cursor:pointer}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:transparent;border:1px solid #86433e;color:var(--red)}button:hover{filter:brightness(1.06)}.notice{min-height:24px;color:var(--amber);margin-top:14px}.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}.metric{padding:18px 0;border-bottom:1px solid var(--line)}.metric b{display:block;font-size:1.8rem;letter-spacing:-.04em}.metric small{color:var(--muted)}.section{margin-top:36px}.section h2{font-size:1.35rem;letter-spacing:-.02em;margin:0 0 12px}.rows{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}.name{font-weight:700}.meta{font-size:.85rem;color:var(--muted);margin-top:3px}.status{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--amber)}.status.conectado{color:var(--mint)}.actions{display:flex;gap:8px}.foot{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:32px;color:var(--muted);font-size:.88rem}@media(max-width:680px){.shell{padding:28px 18px}.overview{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr auto}.actions{grid-column:1/-1}.foot{align-items:flex-start;flex-direction:column}header{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"></main>
  <script>
    const app=document.querySelector('#app'); let tokenRecente='';
    const api=(url, options={})=>fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Não foi possível concluir a ação.');return d});
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function auth(configurado){app.innerHTML=`<section class="panel auth"><h1>${configurado?'Entrar na':'Ativar a'} <span>Central</span></h1><p>${configurado?'Use a conta administrativa criada no primeiro acesso.':'Crie a única conta administrativa do painel. Depois desta etapa, a rota de ativação será desabilitada.'}</p><form class="form" id="form"><label>Usuário<input name="usuario" autocomplete="username" required minlength="3"></label><label>Senha<input name="senha" type="password" autocomplete="${configurado?'current-password':'new-password'}" required minlength="12"></label><button>${configurado?'Entrar':'Criar acesso seguro'}</button></form><div class="notice" id="notice"></div></section>`;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api(configurado?'/admin/api/login':'/admin/api/configurar',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});if(configurado)load();else auth(true)}catch(err){document.querySelector('#notice').textContent=err.message}}}
    const row=(x,legacy=false)=>`<div class="row"><div><div class="name">${escape(x.nome)}</div><div class="meta">${legacy?escape(x.id):`ID: ${escape(x.id)}`}${x.numero?` · ${escape(x.numero)}`:''}</div></div><div class="status ${escape(x.status)}">${escape((x.status||'não iniciado').replace('_',' '))}</div><div class="actions">${x.qr?`<button class="secondary" data-qr="${escape(x.id)}">Ver QR</button>`:''}${!legacy?`<button class="secondary" data-rotate="${escape(x.id)}">Rotacionar token</button><button class="danger" data-revoke="${escape(x.id)}">Revogar</button>`:''}<button class="danger" data-kill="${legacy?'l':'c'}:${escape(x.id)}">Encerrar processo</button></div></div>`;
    async function load(){try{const d=await api('/admin/api/conexoes');app.innerHTML=`<header><div><h1>Central <span>WhatsApp</span></h1><p>Visão operacional das integrações e das sessões Chromium ativas.</p></div><button class="secondary" id="logout">Sair</button></header><div class="overview"><div class="metric"><b>${d.clientes.length}</b><small>integrações</small></div><div class="metric"><b>${d.processos_ativos}</b><small>processos em memória</small></div><div class="metric"><b>${d.memoria_mb} MB</b><small>memória do serviço</small></div></div><section class="section panel"><h2>Nova integração</h2><form class="form" id="novo"><label>Nome da aplicação<input name="nome" required maxlength="120" placeholder="Ex.: Sistema Like"></label><label>ID técnico<input name="id" required pattern="[a-z0-9][a-z0-9-]{1,62}" placeholder="Ex.: sistema-like"></label><button>Gerar token da integração</button></form>${tokenRecente?`<div class="notice">Copie agora: este token não será exibido novamente.<br><input id="token" readonly value="${tokenRecente}"><button class="secondary" id="copy">Copiar token</button></div>`:''}</section><section class="section"><h2>Integrações</h2><div class="rows">${d.clientes.length?d.clientes.map(x=>row(x)).join(''):'<p>Nenhuma integração cadastrada.</p>'}</div></section><section class="section"><h2>Linhas legadas</h2><div class="rows">${d.legadas.map(x=>row(x,true)).join('')}</div></section><footer class="foot"><span>Encerrar processo preserva a sessão WhatsApp. O próximo acesso a reconecta.</span><button class="danger" id="restart">Reiniciar serviço</button></footer>`;document.querySelector('#logout').onclick=async()=>{await api('/admin/api/logout',{method:'POST'});boot()};document.querySelector('#novo').onsubmit=async e=>{e.preventDefault();try{const r=await api('/admin/api/clientes',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});tokenRecente=r.token;load()}catch(err){alert(err.message)}};document.querySelector('#copy')?.addEventListener('click',()=>navigator.clipboard.writeText(tokenRecente));document.querySelectorAll('[data-kill]').forEach(b=>b.onclick=async()=>{if(!confirm('Encerrar somente o Chromium desta conexão? A sessão será preservada.'))return;const[t,id]=b.dataset.kill.split(':');try{await api(`/admin/api/${t==='l'?'legadas':'clientes'}/${encodeURIComponent(id)}/encerrar`,{method:'POST'});load()}catch(e){alert(e.message)}});document.querySelectorAll('[data-rotate]').forEach(b=>b.onclick=async()=>{if(!confirm('Rotacionar o token invalida o token atual imediatamente. Continuar?'))return;const r=await api(`/admin/api/clientes/${encodeURIComponent(b.dataset.rotate)}/rotacionar`,{method:'POST'});tokenRecente=r.token;load()});document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{if(!confirm('Revogar apaga a integração e a sessão WhatsApp. Continuar?'))return;await api(`/admin/api/clientes/${encodeURIComponent(b.dataset.revoke)}`,{method:'DELETE'});load()});document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>{const x=d.clientes.concat(d.legadas).find(x=>x.id===b.dataset.qr);const w=window.open('','_blank');w.document.write(`<img src="${x.qr}" alt="QR Code">`)});document.querySelector('#restart').onclick=async()=>{if(!confirm('Reiniciar o serviço encerra todos os Chromiums e preserva as sessões. Continuar?'))return;await api('/admin/api/reiniciar',{method:'POST'});app.innerHTML='<section class="panel auth"><h1>Reiniciando</h1><p>O serviço voltará em alguns segundos. Atualize a página.</p></section>'}}catch(e){if(e.message.includes('Faça login'))auth(true);else app.textContent=e.message}}
    async function boot(){const e=await api('/admin/api/estado');if(e.autenticado)load();else auth(e.configurado)}boot();
  </script>
</body>
</html>
